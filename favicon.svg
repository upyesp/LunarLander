<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#111"/>
  <!-- Lander body -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#fff" stroke-width="1.5" opacity=".2"/>
  <polygon points="20,16 44,16 40,36 24,36" fill="none" stroke="#e8e8e8" stroke-width="2.2"/>
  <!-- Legs -->
  <line x1="24" y1="36" x2="16" y2="52" stroke="#e8e8e8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="40" y1="36" x2="48" y2="52" stroke="#e8e8e8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Footpads -->
  <line x1="10" y1="52" x2="22" y2="52" stroke="#e8e8e8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="42" y1="52" x2="54" y2="52" stroke="#e8e8e8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Antenna -->
  <line x1="32" y1="16" x2="32" y2="10" stroke="#e8e8e8" stroke-width="1.5"/>
  <circle cx="32" cy="9" r="2" fill="#e8e8e8"/>
  <!-- Window -->
  <circle cx="32" cy="26" r="4" fill="none" stroke="#f0c040" stroke-width="1.5"/>
  <!-- Thrust flame -->
  <polygon points="29,36 32,48 35,36" fill="#f0c040" opacity=".9"/>
</svg>
