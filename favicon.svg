<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Lunar Lander Favicon - Monochrome vector style -->
  <rect width="64" height="64" fill="#0a0a0f"/>

  <!-- Main body (triangle) -->
  <polygon points="32,8 20,42 44,42" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Center detail -->
  <rect x="30" y="26" width="4" height="4" fill="#ffffff"/>

  <!-- Left leg -->
  <line x1="22" y1="42" x2="18" y2="54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right leg -->
  <line x1="42" y1="42" x2="46" y2="54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Thrust flame (small) -->
  <polygon points="30,8 32,2 34,8" fill="#ff6400" opacity="0.9"/>
</svg>
