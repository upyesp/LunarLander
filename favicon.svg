<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#000"/>
  <!-- Lunar Lander favicon — monochrome vector style -->
  <!-- Body / cabin -->
  <polygon points="12,9 20,9 21,14 11,14" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Solar panel / top deck -->
  <rect x="10" y="7" width="12" height="2" fill="none" stroke="#fff" stroke-width="1.2" rx="0.3"/>
  <!-- Antenna -->
  <line x1="16" y1="7" x2="16" y2="4" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="16" cy="3.5" r="0.8" fill="#fff"/>
  <!-- Left leg -->
  <line x1="12.5" y1="14" x2="9" y2="24" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="19.5" y1="14" x2="23" y2="24" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Left foot pad -->
  <line x1="7" y1="25" x2="11" y2="25" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right foot pad -->
  <line x1="21" y1="25" x2="25" y2="25" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Throttle / engine bell -->
  <path d="M13,14 L12,17 Q16,19 20,17 L19,14" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
