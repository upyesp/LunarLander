<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Lunar Lander Favicon - Monochrome Vector Style -->
  <rect width="64" height="64" fill="#0a0a0f"/>

  <!-- Main body (yellow/orange) -->
  <path d="M28,18 L36,18 L40,28 L38,36 L26,36 L24,28 Z"
        fill="#ffeb3b" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Top antenna -->
  <line x1="32" y1="12" x2="32" y2="18"
        stroke="#ffffff" stroke-width="1.5"/>

  <!-- Landing legs -->
  <path d="M26,36 L20,42 M38,36 L44,42"
        stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- Thrust flame (small, indicating ready) -->
  <path d="M29,36 L32,44 L35,36 Z"
        fill="#ff9800" opacity="0.8"/>

  <!-- Pad indicator dots -->
  <circle cx="28" cy="48" r="2" fill="#00e676"/>
  <circle cx="36" cy="48" r="2" fill="#00e676"/>
</svg>
