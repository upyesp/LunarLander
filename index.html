<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lunar Lander</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      /* Color Palette */
      --color-bg: #0a0a0f;
      --color-surface: #1a1a2e;
      --color-text-primary: #ffffff;
      --color-text-secondary: #b0b0c0;
      --color-accent: #4fc3f7;
      --color-success: #81c784;
      --color-danger: #e57373;
      --color-terrain: #ffffff;
      --color-lander: #ffeb3b;
      --color-pad: #00e676;

      /* Touch Targets */
      --touch-target-min: 56px;
      --touch-padding: 12px;

      /* Typography */
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-md: 1rem;
      --font-size-lg: 1.25rem;
      --font-size-xl: 1.5rem;
      --font-size-xxl: 2rem;

      /* Spacing Rhythm */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-family);
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    canvas {
      flex: 1;
      display: block;
    }

    /* UI Overlays */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 15, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      z-index: 10;
    }

    .overlay.hidden {
      display: none;
    }

    h1, h2, h3 {
      text-align: center;
      margin-bottom: var(--space-lg);
    }

    h1 {
      font-size: var(--font-size-xxl);
      color: var(--color-accent);
    }

    h2 {
      font-size: var(--font-size-xl);
      color: var(--color-success);
    }

    p {
      text-align: center;
      margin-bottom: var(--space-md);
      line-height: 1.6;
      color: var(--color-text-secondary);
    }

    .btn {
      background: var(--color-accent);
      color: var(--color-bg);
      border: none;
      padding: var(--space-md) var(--space-lg);
      font-size: var(--font-size-md);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      min-width: var(--touch-target-min);
      min-height: var(--touch-target-min);
      margin: var(--space-sm);
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-accent);
      border: 2px solid var(--color-accent);
    }

    /* HUD */
    #hud {
      position: absolute;
      top: var(--space-md);
      left: var(--space-md);
      right: var(--space-md);
      display: flex;
      justify-content: space-between;
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      pointer-events: none;
    }

    #hud.hidden {
      display: none;
    }

    /* Touch Controls */
    #controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
    }

    #controls.hidden {
      display: none;
    }

    .control-btn {
      background: rgba(79, 195, 247, 0.2);
      border: 2px solid var(--color-accent);
      color: var(--color-accent);
      font-size: var(--font-size-lg);
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      min-width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .control-btn:active {
      background: rgba(79, 195, 247, 0.5);
    }

    /* Level Select Grid */
    #level-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }

    .level-btn {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-lg);
      font-weight: bold;
    }

    .level-btn.locked {
      background: rgba(255, 255, 255, 0.1);
      color: var(--color-text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .level-btn.unlocked {
      background: var(--color-accent);
      color: var(--color-bg);
    }

    .level-btn.completed {
      background: var(--color-success);
      color: var(--color-bg);
    }

    /* Score Display */
    .score-display {
      font-size: var(--font-size-xl);
      margin: var(--space-md) 0;
    }

    .stat-label {
      color: var(--color-text-secondary);
      font-size: var(--font-size-sm);
    }

    /* Pad Pulse Animation */
    @keyframes pad-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- HUD -->
    <div id="hud" class="hidden">
      <span id="level-indicator">Level 1</span>
      <span id="fuel-display">Fuel: 100%</span>
      <span id="altitude-display">Altitude: 500m</span>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="overlay">
      <h1>LUNAR LANDER</h1>
      <p>Navigate your lander to the landing pad.</p>
      <p>Use thrust and rotation to survive the descent.</p>
      <button id="start-btn" class="btn">START GAME</button>
    </div>

    <!-- Level Select -->
    <div id="level-select" class="overlay hidden">
      <h2>Select Level</h2>
      <div id="level-grid"></div>
      <button id="back-btn" class="btn btn-secondary">BACK</button>
    </div>

    <!-- Game Over -->
    <div id="game-over" class="overlay hidden">
      <h2 style="color: var(--color-danger);">CRASHED!</h2>
      <p>Your lander was destroyed.</p>
      <button id="retry-btn" class="btn">RETRY</button>
      <button id="menu-btn" class="btn btn-secondary">MAIN MENU</button>
    </div>

    <!-- Level Complete -->
    <div id="level-complete" class="overlay hidden">
      <h2>LANDED SUCCESSFULLY!</h2>
      <div class="score-display">
        <p><span class="stat-label">Score:</span> <span id="final-score">0</span></p>
        <p><span class="stat-label">Time:</span> <span id="completion-time">0s</span></p>
        <p><span class="stat-label">Fuel Remaining:</span> <span id="fuel-remaining">0%</span></p>
      </div>
      <button id="next-level-btn" class="btn">NEXT LEVEL</button>
      <button id="menu-complete-btn" class="btn btn-secondary">MAIN MENU</button>
    </div>

    <!-- Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Touch Controls -->
    <div id="controls" class="hidden">
      <button class="control-btn" id="rotate-left">↺</button>
      <button class="control-btn" id="thrust">▲ THRUST</button>
      <button class="control-btn" id="rotate-right">↻</button>
    </div>
  </div>

  <script>
    // Canvas Setup
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 140; // Account for controls
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Level Data (10 levels with increasing difficulty)
    const LEVELS = [
      { // Level 1: Simple flat terrain, wide pad
        terrain: [[0, 500], [800, 500]],
        padStart: [300, 500],
        padWidth: 100,
        startX: 400, startY: 100,
        velocityX: 0, velocityY: 0,
        fuel: 100,
        gravity: 0.15
      },
      { // Level 2: Gentle slope
        terrain: [[0, 600], [400, 400], [800, 600]],
        padStart: [350, 450],
        padWidth: 90,
        startX: 400, startY: 100,
        velocityX: 0.5, velocityY: 0,
        fuel: 100,
        gravity: 0.16
      },
      { // Level 3: Steeper terrain
        terrain: [[0, 700], [200, 400], [600, 500], [800, 700]],
        padStart: [400, 450],
        padWidth: 80,
        startX: 300, startY: 120,
        velocityX: -0.8, velocityY: 0,
        fuel: 90,
        gravity: 0.17
      },
      { // Level 4: Narrower pad
        terrain: [[0, 600], [300, 350], [500, 450], [800, 600]],
        padStart: [380, 400],
        padWidth: 70,
        startX: 250, startY: 100,
        velocityX: 1.2, velocityY: 0,
        fuel: 90,
        gravity: 0.18
      },
      { // Level 5: Asymmetric terrain
        terrain: [[0, 700], [250, 300], [600, 400], [800, 700]],
        padStart: [420, 380],
        padWidth: 75,
        startX: 200, startY: 100,
        velocityX: -1.0, velocityY: 0,
        fuel: 85,
        gravity: 0.19
      },
      { // Level 6: Complex shape
        terrain: [[0, 650], [200, 350], [400, 500], [600, 300], [800, 650]],
        padStart: [500, 320],
        padWidth: 70,
        startX: 150, startY: 120,
        velocityX: 0.8, velocityY: 0,
        fuel: 85,
        gravity: 0.20
      },
      { // Level 7: Narrow pad with wind
        terrain: [[0, 600], [300, 250], [500, 400], [800, 600]],
        padStart: [400, 300],
        padWidth: 60,
        startX: 200, startY: 100,
        velocityX: -1.5, velocityY: 0,
        fuel: 80,
        gravity: 0.21,
        wind: 0.3
      },
      { // Level 8: Extreme slope
        terrain: [[0, 700], [200, 250], [600, 450], [800, 700]],
        padStart: [450, 350],
        padWidth: 65,
        startX: 180, startY: 100,
        velocityX: 1.8, velocityY: 0,
        fuel: 75,
        gravity: 0.22,
        wind: -0.4
      },
      { // Level 9: Very narrow pad
        terrain: [[0, 650], [250, 300], [550, 400], [800, 650]],
        padStart: [400, 350],
        padWidth: 50,
        startX: 220, startY: 120,
        velocityX: -2.0, velocityY: 0,
        fuel: 70,
        gravity: 0.23,
        wind: 0.5
      },
      { // Level 10: Extreme challenge
        terrain: [[0, 600], [200, 200], [400, 450], [700, 300], [800, 600]],
        padStart: [550, 280],
        padWidth: 45,
        startX: 150, startY: 100,
        velocityX: 2.5, velocityY: 0,
        fuel: 65,
        gravity: 0.25,
        wind: -0.6
      }
    ];

    // LocalStorage Management
    function saveProgress() {
      try {
        const data = {
          unlockedLevel: state.unlockedLevel,
          bestScores: state.bestScores,
          completedLevels: state.completedLevels
        };
        localStorage.setItem('lunarLander', JSON.stringify(data));
      } catch (e) {
        console.warn('Failed to save progress:', e);
      }
    }

    function loadProgress() {
      try {
        const data = JSON.parse(localStorage.getItem('lunarLander'));
        if (data) {
          state.unlockedLevel = data.unlockedLevel || 1;
          state.bestScores = data.bestScores || {};
          state.completedLevels = data.completedLevels || [];
        }
      } catch (e) {
        console.warn('Failed to load progress:', e);
      }
    }

    // UI Elements
    const screens = {
      main: document.getElementById('main-menu'),
      levelSelect: document.getElementById('level-select'),
      gameOver: document.getElementById('game-over'),
      complete: document.getElementById('level-complete')
    };

    function showScreen(screenName) {
      Object.values(screens).forEach(el => el.classList.add('hidden'));
      screens[screenName].classList.remove('hidden');

      const hud = document.getElementById('hud');
      const controls = document.getElementById('controls');

      if (screenName === 'playing') {
        hud.classList.remove('hidden');
        controls.classList.remove('hidden');
      } else {
        hud.classList.add('hidden');
        controls.classList.add('hidden');
      }
    }

    // Level Select Grid
    function renderLevelSelect() {
      const grid = document.getElementById('level-grid');
      grid.innerHTML = '';

      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'level-btn';
        btn.textContent = i;

        if (state.completedLevels.includes(i)) {
          btn.classList.add('completed');
        } else if (i <= state.unlockedLevel) {
          btn.classList.add('unlocked');
        } else {
          btn.classList.add('locked');
        }

        if (i <= state.unlockedLevel) {
          btn.addEventListener('click', () => startLevel(i));
        }

        grid.appendChild(btn);
      }
    }

    // Lander Class
    class Lander {
      constructor(x, y, velocityX, velocityY) {
        this.x = x;
        this.y = y;
        this.velocityX = velocityX;
        this.velocityY = velocityY;
        this.rotation = 0;
        this.angularVelocity = 0;
        this.width = 30;
        this.height = 20;
      }

      update(gravity, wind) {
        // Apply gravity
        this.velocityY += gravity;

        // Apply wind
        if (wind) {
          this.velocityX += wind * 0.1;
        }

        // Update position
        this.x += this.velocityX;
        this.y += this.velocityY;

        // Update rotation
        this.rotation += this.angularVelocity;
        this.angularVelocity *= 0.95; // Angular damping

        // Boundary check (wrap horizontally)
        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation * Math.PI / 180);

        // Draw lander body (monochrome vector style)
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--color-lander');
        ctx.lineWidth = 2;
        ctx.fillStyle = 'rgba(255, 235, 59, 0.3)';

        // Main body
        ctx.beginPath();
        ctx.moveTo(-this.width/2, -this.height/2);
        ctx.lineTo(this.width/2, -this.height/2);
        ctx.lineTo(this.width/2 + 5, 0);
        ctx.lineTo(this.width/2, this.height/2);
        ctx.lineTo(-this.width/2, this.height/2);
        ctx.lineTo(-this.width/2 - 5, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Landing legs
        ctx.beginPath();
        ctx.moveTo(-this.width/2, this.height/2);
        ctx.lineTo(-this.width/2 - 10, this.height/2 + 5);
        ctx.moveTo(this.width/2, this.height/2);
        ctx.lineTo(this.width/2 + 10, this.height/2 + 5);
        ctx.stroke();

        // Thrust flame (if thrusting)
        if (state.thrustActive && state.fuel > 0) {
          ctx.beginPath();
          ctx.moveTo(-8, this.height/2);
          ctx.lineTo(0, this.height/2 + 15 + Math.random() * 5);
          ctx.lineTo(8, this.height/2);
          ctx.fillStyle = '#ff9800';
          ctx.fill();
        }

        ctx.restore();
      }

      getCenter() {
        return { x: this.x, y: this.y };
      }

      getFeet() {
        const rad = this.rotation * Math.PI / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);

        const leftFoot = {
          x: this.x + (-this.width/2 - 10) * cos - (this.height/2 + 5) * sin,
          y: this.y + (-this.width/2 - 10) * sin + (this.height/2 + 5) * cos
        };

        const rightFoot = {
          x: this.x + (this.width/2 + 10) * cos - (this.height/2 + 5) * sin,
          y: this.y + (this.width/2 + 10) * sin + (this.height/2 + 5) * cos
        };

        return [leftFoot, rightFoot];
      }
    }

    // Game Logic
    let state = {
      screen: 'main',
      currentLevel: 1,
      unlockedLevel: 1,
      bestScores: {},
      completedLevels: [],
      lander: null,
      terrain: null,
      pad: null,
      fuel: 0,
      startTime: 0,
      gameLoop: null,
      thrustActive: false,
      rotateLeft: false,
      rotateRight: false
    };

    function startLevel(levelNum) {
      const level = LEVELS[levelNum - 1];

      state.screen = 'playing';
      state.currentLevel = levelNum;
      state.lander = new Lander(level.startX, level.startY, level.velocityX, level.velocityY);
      state.terrain = level.terrain;
      state.pad = { x: level.padStart[0], y: level.padStart[1], width: level.padWidth };
      state.fuel = level.fuel;
      state.startTime = Date.now();
      state.thrustActive = false;
      state.rotateLeft = false;
      state.rotateRight = false;

      // Initialize starfield for this screen size
      stars.length = 0;
      initStars();

      showScreen('playing');
      document.getElementById('level-indicator').textContent = `Level ${levelNum}`;

      if (state.gameLoop) {
        cancelAnimationFrame(state.gameLoop);
      }
      gameLoop();
    }

    function updateLander() {
      const level = LEVELS[state.currentLevel - 1];

      // Sub-stepping for high-velocity objects to prevent tunneling
      const maxSubsteps = 3;
      const landerVelMag = Math.sqrt(
        state.lander.velocityX ** 2 + state.lander.velocityY ** 2
      );
      const substeps = landerVelMag > 5 ? maxSubsteps : 1;

      for (let step = 0; step < substeps; step++) {
        // Apply gravity and wind per sub-step
        state.lander.velocityY += level.gravity / substeps;
        if (level.wind) {
          state.lander.velocityX += (level.wind * 0.1) / substeps;
        }

        // Update position per sub-step
        state.lander.x += state.lander.velocityX / substeps;
        state.lander.y += state.lander.velocityY / substeps;

        // Boundary check (wrap horizontally)
        if (state.lander.x < 0) state.lander.x = canvas.width;
        if (state.lander.x > canvas.width) state.lander.x = 0;
      }

      // Update rotation
      state.lander.rotation += state.lander.angularVelocity;
      state.lander.angularVelocity *= 0.95; // Angular damping

      // Handle thrust input (not sub-stepped, applied once per frame)
      if (state.thrustActive && state.fuel > 0) {
        const rad = state.lander.rotation * Math.PI / 180;
        state.lander.velocityX -= Math.sin(rad) * 0.35;
        state.lander.velocityY += Math.cos(rad) * 0.35;
        state.fuel -= 0.25; // Fuel depletion per frame (60fps ≈ 4 seconds continuous thrust)

        // Haptic feedback
        if (navigator.vibrate) {
          navigator.vibrate(15);
        }
      }

      // Handle rotation input
      if (state.rotateLeft) {
        state.lander.angularVelocity = -2;
      } else if (state.rotateRight) {
        state.lander.angularVelocity = 2;
      }
    }

    function checkCollisions() {
      const feet = state.lander.getFeet();

      // Check terrain collision (any part of lander touching terrain)
      for (let i = 0; i < state.terrain.length - 1; i++) {
        const [x1, y1] = state.terrain[i];
        const [x2, y2] = state.terrain[i + 1];

        // Check both feet against this terrain segment
        for (const foot of feet) {
          if (pointNearSegment(foot, x1, y1, x2, y2)) {
            return 'crash';
          }
        }

        // Also check lander center against terrain (for cases where only body touches)
        const landerY = state.lander.y + state.lander.height / 2;
        if (pointNearSegment({x: state.lander.x, y: landerY}, x1, y1, x2, y2)) {
          return 'crash';
        }
      }

      // Check pad collision (successful landing requires BOTH feet on pad)
      const centerX = state.lander.x;
      const centerY = state.lander.y;

      let bothFeetOnPad = true;
      for (const foot of feet) {
        if (!pointNearSegment(foot, state.pad.x, state.pad.y, state.pad.x + state.pad.width, state.pad.y)) {
          bothFeetOnPad = false;
          break;
        }
      }

      if (bothFeetOnPad) {
        const level = LEVELS[state.currentLevel - 1];

        // Check altitude and angle for safe landing
        const isFlat = Math.abs(state.lander.velocityY) < 3.5 && Math.abs(state.lander.velocityX) < 2;
        const correctAngle = Math.abs(state.lander.rotation % 360) < 25 ||
                             Math.abs(Math.abs(state.lander.rotation % 360) - 360) < 25;

        if (isFlat && correctAngle && state.fuel > 0) {
          return 'success';
        }
      }

      // Check if out of bounds or crashed through terrain
      if (state.lander.y > canvas.height + 100 ||
          Math.abs(state.lander.velocityY) > 8) {
        return 'crash';
      }

      return null;
    }

    function pointNearSegment(point, x1, y1, x2, y2, tolerance = 8) {
      // Check if point is within distance of segment AND between endpoints
      const distToLine = Math.abs((y2 - y1) * point.x - (x2 - x1) * point.y +
                                  x2 * y1 - y2 * x1) / Math.sqrt(Math.pow(y2 - y1, 2) + Math.pow(x2 - x1, 2));

      // Check if point is between the endpoints (projected)
      const dotProduct = ((point.x - x1) * (x2 - x1) + (point.y - y1) * (y2 - y1)) /
                         Math.pow(Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2), 2);

      return distToLine < tolerance && dotProduct >= 0 && dotProduct <= 1;
    }

    function drawTerrain() {
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--color-terrain');
      ctx.lineWidth = 2;

      if (state.terrain.length > 0) {
        ctx.beginPath();
        ctx.moveTo(state.terrain[0][0], state.terrain[0][1]);

        for (let i = 1; i < state.terrain.length; i++) {
          ctx.lineTo(state.terrain[i][0], state.terrain[i][1]);
        }

        // Close the polygon to fill ground below
        ctx.lineTo(state.terrain[state.terrain.length - 1][0], canvas.height);
        ctx.lineTo(state.terrain[0][0], canvas.height);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fill();
        ctx.stroke();
      }
    }

    function drawPad() {
      const padColor = getComputedStyle(document.documentElement).getPropertyValue('--color-pad');

      // Pulsing glow effect
      const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;

      ctx.save();
      ctx.strokeStyle = padColor;
      ctx.lineWidth = 4;
      ctx.globalAlpha = pulse;

      // Draw pad line
      ctx.beginPath();
      ctx.moveTo(state.pad.x, state.pad.y);
      ctx.lineTo(state.pad.x + state.pad.width, state.pad.y);
      ctx.stroke();

      // Draw pad markers
      ctx.fillStyle = padColor;
      ctx.fillRect(state.pad.x - 5, state.pad.y - 3, 10, 6);
      ctx.fillRect(state.pad.x + state.pad.width - 5, state.pad.y - 3, 10, 6);

      ctx.restore();
    }

    function updateHUD() {
      document.getElementById('fuel-display').textContent = `Fuel: ${Math.floor(state.fuel)}%`;
      const altitude = Math.max(0, Math.floor((canvas.height - state.lander.y) / 3));
      document.getElementById('altitude-display').textContent = `Altitude: ${altitude}m`;
    }

    // Starfield background
    const stars = [];
    function initStars() {
      for (let i = 0; i < 100; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 0.5,
          twinkleSpeed: Math.random() * 0.02 + 0.01
        });
      }
    }

    function drawStars() {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      stars.forEach(star => {
        const alpha = 0.4 + Math.sin(Date.now() * star.twinkleSpeed) * 0.3;
        ctx.globalAlpha = alpha;
        ctx.fillRect(star.x, star.y, star.size, star.size);
      });
      ctx.globalAlpha = 1;
    }

    function gameLoop() {
      if (state.screen !== 'playing') return;

      // Clear canvas and draw stars
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--color-bg');
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawStars();

      // Update physics
      updateLander();

      // Draw terrain
      drawTerrain();

      // Draw pad
      drawPad();

      // Draw lander
      state.lander.draw();

      // Check collisions
      const collision = checkCollisions();
      if (collision === 'crash') {
        handleGameOver();
        return;
      } else if (collision === 'success') {
        handleLevelComplete();
        return;
      }

      // Update HUD
      updateHUD();

      state.gameLoop = requestAnimationFrame(gameLoop);
    }

    function handleGameOver() {
      showScreen('gameOver');
      if (state.gameLoop) {
        cancelAnimationFrame(state.gameLoop);
      }
    }

    function handleLevelComplete() {
      const timeElapsed = (Date.now() - state.startTime) / 1000;
      const timeBonus = Math.max(1000 - timeElapsed * 2, 100);
      const fuelMultiplier = state.fuel / LEVELS[state.currentLevel - 1].fuel;
      const finalScore = Math.floor(timeBonus * fuelMultiplier);

      // Update progress
      if (!state.completedLevels.includes(state.currentLevel)) {
        state.completedLevels.push(state.currentLevel);

        if (state.currentLevel === state.unlockedLevel && state.unlockedLevel < 10) {
          state.unlockedLevel++;
        }
      }

      // Update best score
      const prevBest = state.bestScores[state.currentLevel];
      if (!prevBest || finalScore > prevBest) {
        state.bestScores[state.currentLevel] = finalScore;
      }

      saveProgress();

      // Show completion screen
      document.getElementById('final-score').textContent = finalScore;
      document.getElementById('completion-time').textContent = `${timeElapsed.toFixed(1)}s`;
      document.getElementById('fuel-remaining').textContent = `${Math.floor(state.fuel)}%`;

      showScreen('complete');
      if (state.gameLoop) {
        cancelAnimationFrame(state.gameLoop);
      }
    }

    // Event Listeners
    document.getElementById('start-btn').addEventListener('click', () => {
      loadProgress();
      renderLevelSelect();
      showScreen('levelSelect');
    });

    document.getElementById('back-btn').addEventListener('click', () => {
      showScreen('main');
    });

    document.getElementById('retry-btn').addEventListener('click', () => {
      startLevel(state.currentLevel);
    });

    document.getElementById('next-level-btn').addEventListener('click', () => {
      if (state.currentLevel < 10) {
        startLevel(state.currentLevel + 1);
      } else {
        showScreen('main');
      }
    });

    document.getElementById('menu-complete-btn').addEventListener('click', () => {
      showScreen('levelSelect');
      renderLevelSelect();
    });

    // Touch Controls
    const thrustBtn = document.getElementById('thrust');
    const rotateLeftBtn = document.getElementById('rotate-left');
    const rotateRightBtn = document.getElementById('rotate-right');

    function addTouchHandlers(btn, action) {
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        state[action] = true;
      });

      btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        state[action] = false;
      });

      btn.addEventListener('mousedown', () => {
        state[action] = true;
      });

      btn.addEventListener('mouseup', () => {
        state[action] = false;
      });

      btn.addEventListener('mouseleave', () => {
        state[action] = false;
      });
    }

    addTouchHandlers(thrustBtn, 'thrustActive');
    addTouchHandlers(rotateLeftBtn, 'rotateLeft');
    addTouchHandlers(rotateRightBtn, 'rotateRight');

    // Initialize
    loadProgress();
  </script>
</body>
</html>
