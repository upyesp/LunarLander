<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Lunar Lander</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container"></div>

  <!-- Phaser engine -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Helpers & engine modules -->
  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/domui.js"></script>

  <!-- Scenes -->
  <script src="js/scenes/Boot.js"></script>
  <script src="js/scenes/Menu.js"></script>
  <script src="js/scenes/Settings.js"></script>
  <script src="js/scenes/Game.js"></script>
  <script src="js/scenes/GameOver.js"></script>

  <!-- Entry point -->
  <script src="js/main.js"></script>

  <!-- Register the service worker for installable / offline play -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* offline-first is best-effort */ });
      });
    }
  </script>
</body>
</html>
