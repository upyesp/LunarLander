<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Lunar Lander</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; background: #000; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const c = document.getElementById('game');
    const ctx = c.getContext('2d');

    function resize() {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let sx = c.width / 2;
    let sy = 60;
    const shipW = 30;
    const shipH = 20;

    function drawShip(ctx, x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'miter';

      // hull — diamond-ish body with flat bottom
      ctx.beginPath();
      ctx.moveTo(0, -shipH);                  // nose (top)
      ctx.lineTo(shipW * 0.6, shipH * 0.2);   // right shoulder
      ctx.lineTo(shipW * 0.35, shipH);        // right side of body
      ctx.lineTo(-shipW * 0.35, shipH);       // left side of body
      ctx.lineTo(-shipW * 0.6, shipH * 0.2);  // left shoulder
      ctx.closePath();
      ctx.stroke();

      // cockpit window
      ctx.beginPath();
      ctx.arc(0, -shipH * 0.15, shipW * 0.18, 0, Math.PI * 2);
      ctx.stroke();

      // three landing skids (feet)
      ctx.beginPath();
      ctx.moveTo(-shipW * 0.35, shipH);
      ctx.lineTo(-shipW * 0.9, shipH + shipH * 0.45);
      ctx.moveTo(0, shipH);
      ctx.lineTo(0, shipH + shipH * 0.35);
      ctx.moveTo(shipW * 0.35, shipH);
      ctx.lineTo(shipW * 0.9, shipH + shipH * 0.45);
      ctx.stroke();

      // engine flame (idle)
      const fl = shipH * 0.7;
      ctx.beginPath();
      ctx.moveTo(-shipW * 0.2, shipH);
      ctx.lineTo(0, shipH + fl);
      ctx.lineTo(shipW * 0.2, shipH);
      ctx.closePath();
      ctx.stroke();

      ctx.restore();
    }

    function frame() {
      if (c.width !== window.innerWidth || c.height !== window.innerHeight) resize();
      sx = c.width / 2;
      sy = 60;

      ctx.clearRect(0, 0, c.width, c.height);
      drawShip(ctx, sx, sy);
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
