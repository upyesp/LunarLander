<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lunar Lander</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        :root {
            /* Dark mode color palette */
            --bg-color: #0a0a0f;
            --text-primary: #ffffff;
            --text-secondary: #8b8b9e;
            --accent-color: #00ff88;
            --danger-color: #ff4757;
            --warning-color: #ffa502;
            --button-bg: rgba(255, 255, 255, 0.1);
            --button-border: rgba(255, 255, 255, 0.3);
            --overlay-bg: rgba(10, 10, 15, 0.95);

            /* Typography scale */
            --font-size-xs: 12px;
            --font-size-sm: 14px;
            --font-size-base: 16px;
            --font-size-lg: 20px;
            --font-size-xl: 28px;
            --font-size-xxl: 36px;

            /* Spacing rhythm */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;

            /* Touch target minimums */
            --touch-target-min: 48px;
            --button-padding: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
        }

        #gameCanvas {
            display: block;
            background: var(--bg-color);
        }

        /* UI Overlay Screens */
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--overlay-bg);
            z-index: 100;
        }

        .screen.hidden {
            display: none;
        }

        /* Main Menu */
        #mainMenu h1 {
            font-size: var(--font-size-xxl);
            margin-bottom: var(--spacing-lg);
            text-align: center;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .menu-btn {
            width: 240px;
            height: var(--touch-target-min);
            background: var(--button-bg);
            border: 2px solid var(--button-border);
            color: var(--text-primary);
            font-size: var(--font-size-lg);
            font-family: inherit;
            cursor: pointer;
            margin: var(--spacing-sm) 0;
            transition: all 0.2s ease;
        }

        .menu-btn:active {
            background: var(--accent-color);
            color: var(--bg-color);
            transform: scale(0.95);
        }

        /* Level Select */
        #levelSelect h2 {
            font-size: var(--font-size-xl);
            margin-bottom: var(--spacing-lg);
            color: var(--accent-color);
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            max-width: 375px;
        }

        .level-btn {
            width: 60px;
            height: 60px;
            background: var(--button-bg);
            border: 2px solid var(--button-border);
            color: var(--text-primary);
            font-size: var(--font-size-lg);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .level-btn.unlocked {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .level-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .level-btn.completed {
            background: rgba(0, 255, 136, 0.2);
        }

        .level-btn:active:not(.locked) {
            transform: scale(0.9);
        }

        /* Gameplay HUD */
        #gameHUD {
            position: fixed;
            top: var(--spacing-md);
            left: var(--spacing-md);
            right: var(--spacing-md);
            display: flex;
            justify-content: space-between;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            z-index: 50;
        }

        #gameHUD.hidden {
            display: none;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.7);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: 4px;
        }

        /* Touch Controls */
        #touchControls {
            position: fixed;
            bottom: var(--spacing-lg);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: var(--spacing-md);
            z-index: 50;
        }

        #touchControls.hidden {
            display: none;
        }

        .control-btn {
            width: 72px;
            height: 72px;
            background: var(--button-bg);
            border: 2px solid var(--button-border);
            color: var(--text-primary);
            font-size: var(--font-size-sm);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: all 0.1s ease;
        }

        .control-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            transform: scale(0.95);
        }

        /* Completion Screen */
        #completionScreen h2 {
            font-size: var(--font-size-xl);
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }

        .success h2 {
            color: var(--accent-color);
        }

        .failure h2 {
            color: var(--danger-color);
        }

        .score-display {
            font-size: var(--font-size-xxl);
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }

        .best-score {
            font-size: var(--font-size-sm);
            color: var(--warning-color);
            margin-bottom: var(--spacing-xl);
        }

        /* Back Button */
        #backBtn {
            position: fixed;
            top: var(--spacing-md);
            left: var(--spacing-md);
            width: 48px;
            height: 48px;
            background: var(--button-bg);
            border: 2px solid var(--button-border);
            color: var(--text-primary);
            font-size: var(--font-size-lg);
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #backBtn.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Main Menu -->
    <div id="mainMenu" class="screen">
        <h1>LUNAR LANDER</h1>
        <button class="menu-btn" id="newGameBtn">NEW GAME</button>
        <button class="menu-btn" id="continueBtn">CONTINUE</button>
    </div>

    <!-- Level Select -->
    <div id="levelSelect" class="screen hidden">
        <h2>SELECT LEVEL</h2>
        <div class="level-grid" id="levelGrid"></div>
        <button class="menu-btn" id="backFromLevelsBtn" style="margin-top: 24px;">BACK</button>
    </div>

    <!-- Gameplay HUD -->
    <div id="gameHUD" class="hidden">
        <div class="hud-item" id="levelDisplay">LEVEL 1</div>
        <div class="hud-item" id="fuelDisplay">FUEL: 100%</div>
        <div class="hud-item" id="velocityDisplay">V: 0.0</div>
    </div>

    <!-- Touch Controls -->
    <div id="touchControls" class="hidden">
        <button class="control-btn" id="rotateLeftBtn">◀ ROTATE</button>
        <button class="control-btn" id="thrustBtn">▲ THRUST</button>
        <button class="control-btn" id="rotateRightBtn">ROTATE ▶</button>
    </div>

    <!-- Back Button -->
    <button id="backBtn" class="hidden">←</button>

    <!-- Completion Screen -->
    <div id="completionScreen" class="screen hidden">
        <h2 id="completionTitle"></h2>
        <div class="score-display" id="scoreDisplay"></div>
        <div class="best-score" id="bestScoreDisplay"></div>
        <button class="menu-btn" id="nextLevelBtn">NEXT LEVEL</button>
        <button class="menu-btn" id="replayBtn">REPLAY</button>
        <button class="menu-btn" id="menuFromGameBtn">MAIN MENU</button>
    </div>

    <script>
        // Game State Management
        const GameState = {
            mainMenu: 'mainMenu',
            levelSelect: 'levelSelect',
            playing: 'playing',
            completed: 'completed'
        };

        let currentState = GameState.mainMenu;
        let currentLevel = 0;
        let gameStartTime = 0;
        let animationId = null;

        // Coordinate Scaling System - maps level coordinates to canvas size
        const LEVEL_WIDTH = 400; // Level coordinate space width
        const LEVEL_HEIGHT = 520; // Level coordinate space height (extra for top area)
        let scale = 1.0;
        let offsetX = 0;
        let offsetY = 0;

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            calculateScale();
        }

        function calculateScale() {
            // Calculate scale to fit level into canvas with padding
            const horizontalPad = 40; // Keep some margin from edges
            const verticalPad = 60;   // Extra space for HUD elements

            const scaleX = (canvas.width - horizontalPad * 2) / LEVEL_WIDTH;
            const scaleY = (canvas.height - verticalPad * 2) / LEVEL_HEIGHT;
            scale = Math.min(scaleX, scaleY);

            // Center the level in canvas
            offsetX = (canvas.width - LEVEL_WIDTH * scale) / 2;
            offsetY = (canvas.height - LEVEL_HEIGHT * scale) / 2 + verticalPad;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Coordinate conversion utilities
        function worldToScreen(x, y) {
            return {
                x: offsetX + x * scale,
                y: offsetY + (LEVEL_HEIGHT - y) * scale // Flip Y axis
            };
        }

        function screenToWorld(x, y) {
            return {
                x: (x - offsetX) / scale,
                y: LEVEL_HEIGHT - (y - offsetY) / scale // Inverse flip
            };
        }

        // localStorage Management with Error Handling
        class StorageManager {
            constructor() {
                this.version = 1;
                this.key = `lunarLander_v${this.version}`;
                this.defaultData = this.getDefaultData();
            }

            getDefaultData() {
                return {
                    version: this.version,
                    unlockedLevels: [true, false, false, false, false, false, false, false, false, false],
                    bestScores: {} // level -> score or null
                };
            }

            load() {
                try {
                    const data = localStorage.getItem(this.key);
                    if (data) {
                        return JSON.parse(data);
                    }
                } catch (e) {
                    console.warn('Failed to load game data:', e);
                }
                return this.defaultData;
            }

            save(data) {
                try {
                    localStorage.setItem(this.key, JSON.stringify(data));
                    return true;
                } catch (e) {
                    console.warn('Failed to save game data:', e);
                    return false;
                }
            }
        }

        const storage = new StorageManager();
        let gameData = storage.load();

        // Level Data - 10 progressive levels
        const LEVELS = [
            { // Level 1: Gentle slope, wide pad
                terrain: [[0, 500], [400, 500]],
                padStart: 180,
                padWidth: 80,
                startFuel: 300,
                maxFuel: 400,
                gravity: 0.04,
                thrustPower: 0.07,
                rotationSpeed: 2,
                startPos: { x: 150, y: 100 }
            },
            { // Level 2: Flat with slight rise
                terrain: [[0, 500], [150, 480], [350, 470], [400, 500]],
                padStart: 200,
                padWidth: 70,
                startFuel: 320,
                maxFuel: 420,
                gravity: 0.045,
                thrustPower: 0.072,
                rotationSpeed: 2,
                startPos: { x: 180, y: 90 }
            },
            { // Level 3: Uneven terrain
                terrain: [[0, 500], [100, 450], [200, 480], [300, 460], [400, 500]],
                padStart: 150,
                padWidth: 65,
                startFuel: 340,
                maxFuel: 440,
                gravity: 0.05,
                thrustPower: 0.075,
                rotationSpeed: 2,
                startPos: { x: 200, y: 80 }
            },
            { // Level 4: Steeper slopes
                terrain: [[0, 500], [120, 420], [250, 470], [380, 440], [400, 500]],
                padStart: 180,
                padWidth: 60,
                startFuel: 360,
                maxFuel: 460,
                gravity: 0.055,
                thrustPower: 0.078,
                rotationSpeed: 2.2,
                startPos: { x: 160, y: 90 }
            },
            { // Level 5: Complex terrain
                terrain: [[0, 500], [80, 430], [180, 460], [280, 420], [360, 470], [400, 500]],
                padStart: 140,
                padWidth: 55,
                startFuel: 380,
                maxFuel: 480,
                gravity: 0.06,
                thrustPower: 0.08,
                rotationSpeed: 2.2,
                startPos: { x: 220, y: 75 }
            },
            { // Level 6: Narrowing pad
                terrain: [[0, 500], [100, 410], [200, 450], [300, 430], [400, 500]],
                padStart: 200,
                padWidth: 50,
                startFuel: 400,
                maxFuel: 500,
                gravity: 0.065,
                thrustPower: 0.082,
                rotationSpeed: 2.4,
                startPos: { x: 180, y: 85 }
            },
            { // Level 7: Asymmetric layout
                terrain: [[0, 500], [60, 400], [160, 440], [260, 410], [340, 460], [400, 500]],
                padStart: 120,
                padWidth: 48,
                startFuel: 420,
                maxFuel: 520,
                gravity: 0.07,
                thrustPower: 0.085,
                rotationSpeed: 2.4,
                startPos: { x: 140, y: 70 }
            },
            { // Level 8: Tight constraints
                terrain: [[0, 500], [90, 390], [200, 430], [310, 400], [400, 500]],
                padStart: 220,
                padWidth: 45,
                startFuel: 440,
                maxFuel: 540,
                gravity: 0.075,
                thrustPower: 0.088,
                rotationSpeed: 2.6,
                startPos: { x: 200, y: 80 }
            },
            { // Level 9: Challenging geometry
                terrain: [[0, 500], [70, 380], [170, 420], [270, 390], [350, 440], [400, 500]],
                padStart: 160,
                padWidth: 42,
                startFuel: 460,
                maxFuel: 560,
                gravity: 0.08,
                thrustPower: 0.09,
                rotationSpeed: 2.6,
                startPos: { x: 170, y: 65 }
            },
            { // Level 10: Expert level
                terrain: [[0, 500], [80, 370], [190, 410], [290, 380], [370, 430], [400, 500]],
                padStart: 210,
                padWidth: 40,
                startFuel: 480,
                maxFuel: 580,
                gravity: 0.085,
                thrustPower: 0.092,
                rotationSpeed: 2.8,
                startPos: { x: 190, y: 70 }
            }
        ];

        // Lander State
        let lander = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            angle: 0,
            fuel: 300,
            maxFuel: 400,
            active: true
        };

        // Input State
        const input = {
            thrust: false,
            rotateLeft: false,
            rotateRight: false
        };

        // Particle System for Thrust Effect
        let particles = [];

        class Particle {
            constructor(x, y, vx, vy, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.life = life;
                this.maxLife = life;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }

            draw(ctx) {
                const alpha = this.life / this.maxLife;
                ctx.fillStyle = `rgba(255, 100, 0, ${alpha})`;
                ctx.fillRect(this.x - 1, this.y - 1, 2, 2);
            }
        }

        // Physics Engine - Uses feet-based collision detection for stable landings
        function updatePhysics(dt) {
            if (!lander.active) return;

            const level = LEVELS[currentLevel];

            // Apply gravity (constant downward acceleration)
            lander.vy += level.gravity * dt;

            // Apply thrust if active and fuel available
            if (input.thrust && lander.fuel > 0) {
                const radAngle = (lander.angle - 90) * Math.PI / 180;
                lander.vx += Math.cos(radAngle) * level.thrustPower * dt;
                lander.vy += Math.sin(radAngle) * level.thrustPower * dt;

                // Fuel consumption is rate-based, not frame-based for consistency
                const fuelBurnRate = 1.0; // units per second at 60fps equivalent
                lander.fuel -= (fuelBurnRate / 60) * dt;

                if (lander.fuel < 0) {
                    lander.fuel = 0;
                }

                // Generate thrust particles
                for (let i = 0; i < 3; i++) {
                    const particleVx = -Math.cos(radAngle) * (2 + Math.random() * 4);
                    const particleVy = -Math.sin(radAngle) * (2 + Math.random() * 4);
                    particles.push(new Particle(
                        lander.x,
                        lander.y + 15, // Emit from bottom of lander (feet position)
                        particleVx,
                        particleVy,
                        20 + Math.random() * 10
                    ));
                }

                // Haptic feedback - only vibrate periodically to avoid battery drain
                if (navigator.vibrate && Math.floor(Date.now() / 500) % 2 === 0) {
                    navigator.vibrate(15);
                }
            }

            // Apply rotation (degrees per second, divided by dt for frame-rate independence)
            const rotPerFrame = level.rotationSpeed * dt;
            if (input.rotateLeft) {
                lander.angle -= rotPerFrame;
            }
            if (input.rotateRight) {
                lander.angle += rotPerFrame;
            }

            // Update position
            lander.x += lander.vx * dt;
            lander.y += lander.vy * dt;

            // Boundary checking - out of bounds means mission failed
            if (lander.x < 0 || lander.x > LEVEL_WIDTH) {
                lander.active = false;
                showCompletion(false);
                return;
            }

            // Terrain collision check using feet position for accurate landing detection
            const feetY = lander.y - 15; // Lander feet are at y-15 in world coordinates

            // Check if lander is below terrain surface
            if (feetY <= getTerrainY(level.terrain, lander.x)) {
                checkLandingSuccess(feetY);
                return;
            }

            // Update particles with frame-rate independent movement and lifecycle
            particles.forEach(p => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt; // Life decreases proportionally to time elapsed
            });

            // Remove dead particles (life <= 0)
            particles = particles.filter(p => p.life > 0);
        }

        function checkLandingSuccess(feetY) {
            const level = LEVELS[currentLevel];

            // Calculate landing angle (0 degrees = upright, positive = tilted right)
            const landingAngle = Math.abs(lander.angle % 360);

            // Check if landed on pad with acceptable speed and orientation
            const onPadX = lander.x >= level.padStart &&
                          lander.x <= level.padStart + level.padWidth;

            const lowVerticalSpeed = Math.abs(lander.vy) < 2.5;
            const lowHorizontalSpeed = Math.abs(lander.vx) < 1.5;
            const acceptableAngle = landingAngle <= 8 || landingAngle >= 352; // Near upright or full rotation

            if (onPadX && lowVerticalSpeed && lowHorizontalSpeed && acceptableAngle) {
                // Successful landing - freeze lander on pad
                lander.y = feetY + 15; // Set position to surface
                lander.active = false;
                showCompletion(true);
            } else {
                // Crash - too fast, wrong angle, or not on pad
                lander.active = false;

                // Create explosion particles
                for (let i = 0; i < 20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1 + Math.random() * 3;
                    particles.push(new Particle(
                        lander.x,
                        feetY,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed - 2,
                        30 + Math.random() * 20
                    ));
                }

                setTimeout(() => showCompletion(false), 100); // Slight delay for explosion effect
            }
        }

        function getTerrainY(terrainPoints, x) {
            if (terrainPoints.length < 2) return LEVEL_HEIGHT;

            // Find terrain segment containing this X coordinate
            let closestSegment = null;
            let minDistance = Infinity;

            for (let i = 0; i < terrainPoints.length - 1; i++) {
                const p1 = terrainPoints[i];
                const p2 = terrainPoints[i + 1];

                // Check if x is within this segment's X range
                const minX = Math.min(p1[0], p2[0]);
                const maxX = Math.max(p1[0], p2[0]);

                if (x >= minX && x <= maxX) {
                    closestSegment = { p1, p2 };
                    break; // Use first matching segment
                }

                // Find closest point on this segment to the X coordinate
                const segMinX = Math.min(p1[0], p2[0]);
                const dist = x < segMinX ? segMinX - x : 0;
                if (dist < minDistance) {
                    minDistance = dist;
                    closestSegment = { p1, p2 };
                }
            }

            // Calculate Y at this X using linear interpolation
            const segment = closestSegment;
            if (!segment) return LEVEL_HEIGHT;

            const [x1, y1] = segment.p1;
            const [x2, y2] = segment.p2;

            let t;
            if (Math.abs(x2 - x1) < 0.001) {
                // Vertical line
                return y1;
            } else {
                t = (x - x1) / (x2 - x1);
                // Clamp t to [0, 1] for safety
                t = Math.max(0, Math.min(1, t));
            }

            const y = y1 + t * (y2 - y1);
            return y;
        }

        // Rendering Engine - Uses coordinate conversion for proper scaling
        function render() {
            // Clear canvas with background
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (currentState !== GameState.playing) return;

            const level = LEVELS[currentLevel];

            // Save context and apply coordinate transform
            ctx.save();
            ctx.scale(scale, scale);
            ctx.translate(offsetX / scale, offsetY / scale);

            // Draw terrain using world coordinates
            drawTerrain(level.terrain);

            // Draw landing pad with glow effect
            drawLandingPad(level.padStart, level.padWidth, level.terrain);

            // Restore context before drawing lander (we handle its transform separately)
            ctx.restore();

            // Draw particles in screen space for consistent size
            const scaledParticles = particles.map(p => ({...p}));
            drawParticles(scaledParticles);

            // Draw lander with proper coordinate conversion
            drawLanderInWorld(level.terrain);

            // Update HUD (screen-based)
            updateHUD();
        }

        function drawTerrain(terrainPoints) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.beginPath();

            terrainPoints.forEach((point, index) => {
                const [x, y] = point;
                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });

            // Close the path to bottom for fill
            ctx.lineTo(terrainPoints[terrainPoints.length - 1][0], LEVEL_HEIGHT + 20);
            ctx.lineTo(terrainPoints[0][0], LEVEL_HEIGHT + 20);
            ctx.closePath();

            // Fill terrain with semi-transparent white
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fill();

            // Stroke the outline on top
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawLandingPad(startX, width, terrainPoints) {
            // Calculate landing surface Y at pad center
            const centerX = startX + width / 2;
            const yAtCenter = getTerrainY(terrainPoints, centerX);

            // Pulsing glow effect for high visibility
            const pulsePhase = (Date.now() % 1000) / 1000; // 0-1 cycle over 1 second
            const glowIntensity = 0.5 + Math.sin(pulsePhase * Math.PI * 2) * 0.5; // 0-1

            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 10 + glowIntensity * 15;

            ctx.strokeStyle = `rgba(0, 255, 136, ${0.7 + glowIntensity * 0.3})`;
            ctx.lineWidth = 4;

            // Draw pad line at correct Y position on terrain
            const yAtStart = getTerrainY(terrainPoints, startX);
            const yAtEnd = getTerrainY(terrainPoints, startX + width);

            ctx.beginPath();
            ctx.moveTo(startX, yAtStart);
            ctx.lineTo(startX + width, yAtEnd);
            ctx.stroke();

            // Reset shadow for other elements
            ctx.shadowBlur = 0;

            // Pad markers (start and end) with glow
            const markerSize = 3;
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(startX - markerSize, yAtStart - markerSize, markerSize * 2, markerSize * 2);
            ctx.fillRect(startX + width - markerSize, yAtEnd - markerSize, markerSize * 2, markerSize * 2);

            // Draw "PAD" text in center of pad (small)
            const midY = (yAtStart + yAtEnd) / 2;
            ctx.font = '8px monospace';
            ctx.fillStyle = '#00ff88';
            ctx.textAlign = 'center';
            ctx.fillText('PAD', centerX, midY - 5);
        }

        function drawParticles(particlesArray) {
            particlesArray.forEach(p => {
                const screenPos = worldToScreen(p.x, p.y);
                // Scale particle size with canvas but cap it for visual consistency
                const particleSize = Math.max(1.5, 2 * scale);

                ctx.fillStyle = `rgba(255, 100, 0, ${p.life / p.maxLife})`;
                ctx.fillRect(
                    screenPos.x - particleSize / 2,
                    screenPos.y - particleSize / 2,
                    particleSize,
                    particleSize
                );
            });
        }

        function drawLanderInWorld() {
            // Land in world coordinates for proper scaling and rotation
            ctx.save();
            ctx.translate(lander.x, lander.y);
            ctx.rotate((lander.angle * Math.PI) / 180);

            // Monochrome vector style (1970s arcade aesthetic)
            const bodyColor = '#ffffff';
            ctx.strokeStyle = bodyColor;
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';

            // Main triangular body
            ctx.beginPath();
            ctx.moveTo(0, -15);      // Top center (top of lander)
            ctx.lineTo(-10, 8);     // Left leg attachment point
            ctx.lineTo(10, 8);      // Right leg attachment point
            ctx.closePath();
            ctx.stroke();

            // Legs extending from body
            const legLength = 7;
            ctx.beginPath();
            ctx.moveTo(-10, 8);     // Left body connection
            ctx.lineTo(-14, 15);    // Left foot position (downward)
            ctx.moveTo(10, 8);      // Right body connection
            ctx.lineTo(14, 15);     // Right foot position (downward)
            ctx.stroke();

            // Add small circular "feet" pads at leg ends for visual clarity
            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.arc(-14, 15, 2, 0, Math.PI * 2);
            ctx.arc(14, 15, 2, 0, Math.PI * 2);
            ctx.fill();

            // Center detail (small square window)
            ctx.fillStyle = bodyColor;
            ctx.fillRect(-3, -6, 6, 6);

            ctx.restore();
        }

        function updateHUD() {
            document.getElementById('levelDisplay').textContent = `LEVEL ${currentLevel + 1}`;
            const fuelPercent = Math.max(0, (lander.fuel / lander.maxFuel) * 100);
            document.getElementById('fuelDisplay').textContent = `FUEL: ${Math.floor(fuelPercent)}%`;

            // Color code fuel
            if (fuelPercent < 25) {
                document.getElementById('fuelDisplay').style.color = '#ff4757';
            } else if (fuelPercent < 50) {
                document.getElementById('fuelDisplay').style.color = '#ffa502';
            } else {
                document.getElementById('fuelDisplay').style.color = '#ffffff';
            }

            const speed = Math.sqrt(lander.vx * lander.vx + lander.vy * lander.vy);
            document.getElementById('velocityDisplay').textContent = `V: ${speed.toFixed(1)}`;
        }

        // Game Loop with proper timing and fixed timestep
        let lastTimestamp = 0;
        const MAX_DT = 3; // Maximum dt in frame-time units to prevent huge jumps on lag spikes

        function gameLoop(timestamp) {
            if (currentState !== GameState.playing) return;

            // Calculate delta time in seconds, capped for stability
            let dt = 1; // Default to 1 (one frame at 60fps)
            if (lastTimestamp > 0) {
                const elapsedMs = timestamp - lastTimestamp;
                dt = Math.min(elapsedMs / 16.67, MAX_DT); // Convert ms to frame-time units, cap at MAX_DT
            }
            lastTimestamp = timestamp;

            updatePhysics(dt);
            render();

            animationId = requestAnimationFrame(gameLoop);
        }

        // UI Management
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        function hideAllUI() {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('gameHUD').classList.add('hidden');
            document.getElementById('touchControls').classList.add('hidden');
            document.getElementById('backBtn').classList.add('hidden');
        }

        function showGameUI() {
            hideAllUI();
            document.getElementById('gameHUD').classList.remove('hidden');
            document.getElementById('touchControls').classList.remove('hidden');
            document.getElementById('backBtn').classList.remove('hidden');
        }

        // Game Flow Functions
        function startNewGame() {
            gameData = storage.getDefaultData();
            showLevelSelect();
        }

        function continueGame() {
            showLevelSelect();
        }

        function showLevelSelect() {
            currentState = GameState.levelSelect;
            renderLevelGrid();
            showScreen('levelSelect');
            hideAllUI();
        }

        function startLevel(levelIndex) {
            if (!gameData.unlockedLevels[levelIndex]) return;

            currentLevel = levelIndex;
            const level = LEVELS[currentLevel];

            // Reset lander state
            lander.x = level.startPos.x;
            lander.y = level.startPos.y;
            lander.vx = 0;
            lander.vy = 0;
            lander.angle = 0;
            lander.fuel = level.startFuel;
            lander.maxFuel = level.maxFuel;
            lander.active = true;

            // Reset particles
            particles = [];

            // Start game timer
            gameStartTime = Date.now();

            // Show game UI
            currentState = GameState.playing;
            showGameUI();
            document.getElementById('levelDisplay').textContent = `LEVEL ${currentLevel + 1}`;

            // Start game loop
            lastTime = performance.now();
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        function showCompletion(success) {
            currentState = GameState.completed;

            const elapsed = (Date.now() - gameStartTime) / 1000;
            const timeBonus = Math.max(0, 300 - elapsed) * 10;
            const fuelMultiplier = lander.fuel / lander.maxFuel;
            const score = Math.floor(timeBonus * fuelMultiplier);

            // Update best scores and unlocks
            if (success) {
                // Save score
                if (!gameData.bestScores[currentLevel] ||
                    gameData.bestScores[currentLevel] < score) {
                    gameData.bestScores[currentLevel] = score;
                }

                // Unlock next level
                if (currentLevel < 9 && !gameData.unlockedLevels[currentLevel + 1]) {
                    gameData.unlockedLevels[currentLevel + 1] = true;
                }

                storage.save(gameData);

                document.getElementById('completionTitle').textContent = 'MISSION SUCCESS';
                document.getElementById('scoreDisplay').textContent = score;

                if (gameData.bestScores[currentLevel] === score) {
                    document.getElementById('bestScoreDisplay').textContent = '★ NEW BEST! ★';
                } else if (gameData.bestScores[currentLevel]) {
                    document.getElementById('bestScoreDisplay').textContent =
                        `Best: ${gameData.bestScores[currentLevel]}`;
                }

                // Show/hide next level button
                const nextBtn = document.getElementById('nextLevelBtn');
                if (currentLevel < 9) {
                    nextBtn.style.display = 'block';
                } else {
                    nextBtn.style.display = 'none';
                }
            } else {
                // Save score even for failed attempts (for tracking purposes)
                document.getElementById('completionTitle').textContent = 'MISSION FAILED';
                document.getElementById('scoreDisplay').textContent = '0';

                if (gameData.bestScores[currentLevel]) {
                    document.getElementById('bestScoreDisplay').textContent =
                        `Best: ${gameData.bestScores[currentLevel]}`;
                } else {
                    document.getElementById('bestScoreDisplay').textContent = '';
                }

                document.getElementById('nextLevelBtn').style.display = 'none';
            }

            showScreen('completionScreen');
        }

        function renderLevelGrid() {
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';

            LEVELS.forEach((_, index) => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.textContent = index + 1;

                if (gameData.unlockedLevels[index]) {
                    btn.classList.add('unlocked');

                    if (gameData.bestScores[index] !== undefined &&
                        gameData.bestScores[index] !== null) {
                        btn.classList.add('completed');
                    }
                } else {
                    btn.classList.add('locked');
                    btn.textContent = '🔒';
                }

                btn.addEventListener('click', () => startLevel(index));
                grid.appendChild(btn);
            });
        }

        // Touch Control Setup
        function setupTouchControls() {
            const thrustBtn = document.getElementById('thrustBtn');
            const rotateLeftBtn = document.getElementById('rotateLeftBtn');
            const rotateRightBtn = document.getElementById('rotateRightBtn');

            [thrustBtn, rotateLeftBtn, rotateRightBtn].forEach(btn => {
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    btn.classList.add('active');

                    if (btn.id === 'thrustBtn') input.thrust = true;
                    else if (btn.id === 'rotateLeftBtn') input.rotateLeft = true;
                    else if (btn.id === 'rotateRightBtn') input.rotateRight = true;

                    // Haptic feedback on press
                    if (navigator.vibrate) {
                        navigator.vibrate(10);
                    }
                });

                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    btn.classList.remove('active');

                    if (btn.id === 'thrustBtn') input.thrust = false;
                    else if (btn.id === 'rotateLeftBtn') input.rotateLeft = false;
                    else if (btn.id === 'rotateRightBtn') input.rotateRight = false;
                });

                btn.addEventListener('touchcancel', () => {
                    btn.classList.remove('active');

                    if (btn.id === 'thrustBtn') input.thrust = false;
                    else if (btn.id === 'rotateLeftBtn') input.rotateLeft = false;
                    else if (btn.id === 'rotateRightBtn') input.rotateRight = false;
                });

                // Mouse fallback for testing
                btn.addEventListener('mousedown', () => {
                    btn.classList.add('active');
                    if (btn.id === 'thrustBtn') input.thrust = true;
                    else if (btn.id === 'rotateLeftBtn') input.rotateLeft = true;
                    else if (btn.id === 'rotateRightBtn') input.rotateRight = true;
                });

                btn.addEventListener('mouseup', () => {
                    btn.classList.remove('active');
                    if (btn.id === 'thrustBtn') input.thrust = false;
                    else if (btn.id === 'rotateLeftBtn') input.rotateLeft = false;
                    else if (btn.id === 'rotateRightBtn') input.rotateRight = false;
                });

                btn.addEventListener('mouseleave', () => {
                    btn.classList.remove('active');
                    if (btn.id === 'thrustBtn') input.thrust = false;
                    else if (btn.id === 'rotateLeftBtn') input.rotateLeft = false;
                    else if (btn.id === 'rotateRightBtn') input.rotateRight = false;
                });
            });
        }

        // Event Listeners
        document.getElementById('newGameBtn').addEventListener('click', startNewGame);
        document.getElementById('continueBtn').addEventListener('click', continueGame);
        document.getElementById('backFromLevelsBtn').addEventListener('click', () => {
            currentState = GameState.mainMenu;
            showScreen('mainMenu');
        });

        document.getElementById('nextLevelBtn').addEventListener('click', () => {
            if (currentLevel < 9) {
                startLevel(currentLevel + 1);
            }
        });

        document.getElementById('replayBtn').addEventListener('click', () => {
            startLevel(currentLevel);
        });

        document.getElementById('menuFromGameBtn').addEventListener('click', () => {
            currentState = GameState.mainMenu;
            showScreen('mainMenu');
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            currentState = GameState.levelSelect;
            renderLevelGrid();
            showScreen('levelSelect');
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });

        // Initialize
        setupTouchControls();
        showScreen('mainMenu');
    </script>
</body>
</html>
